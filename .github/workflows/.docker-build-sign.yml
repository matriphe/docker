---
name: Reusable Docker Build and Sign

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: "."
      image_name:
        required: false
        type: string
        default: ""
      image_tag:
        required: false
        type: string
        default: ""
      image_tags:
        required: false
        type: string
        default: ""
      build_args:
        required: false
        type: string
        default: ""
      file:
        required: false
        type: string
        default: ""
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      push_image:
        required: false
        type: boolean
        default: true
      sign_image:
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        if: ${{ inputs.sign_image }}
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: "v3.0.5"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: ${{ inputs.push_image }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name != '' &&
            inputs.image_name || github.repository }}

      - name: Resolve image tags
        id: tags
        env:
          IMAGE_NAME: ${{ inputs.image_name != '' && inputs.image_name || github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_TAGS: ${{ inputs.image_tags }}
        run: |
          set -eu

          raw_tags="${IMAGE_TAGS}"
          if [ -z "${raw_tags}" ]; then
            raw_tags="${IMAGE_TAG}"
          fi

          resolved_tags=""
          while IFS= read -r tag; do
            tag="$(printf '%s' "${tag}" | xargs)"
            if [ -z "${tag}" ]; then
              continue
            fi
            resolved_tags="${resolved_tags}${REGISTRY}/${IMAGE_NAME}:${tag}"$'\n'
          done <<EOF
          ${raw_tags}
          EOF

          if [ -z "${resolved_tags}" ]; then
            echo "No image tags were resolved." >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            printf '%s' "${resolved_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ inputs.file }}
          build-args: |
            ${{ inputs.build_args }}
            BUILDKIT_INLINE_CACHE=1
          push: ${{ inputs.push_image }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ inputs.image_name != '' && inputs.image_name || github.repository }}:cache
            type=gha
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ inputs.image_name != '' && inputs.image_name || github.repository }}:cache,mode=max
            type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}

      - name: Sign the published Docker image
        if: ${{ inputs.sign_image }}
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          printf '%s\n' "${TAGS}" | while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            cosign sign --yes "${tag}@${DIGEST}"
          done
